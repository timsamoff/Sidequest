<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sidequest</title>
<meta property="og:title" content="Sidequest">
<meta property="og:description" content="A small project planner that runs entirely in your browser. There is no account, no server, and no build step.">
<meta property="og:image" content="https://samoff.com/sidequest/assets/sidequest-icon-512.png">
<meta property="og:url" content="https://samoff.com/sidequest/">
<meta property="og:type" content="website">
<link rel="icon" type="image/svg+xml" href="assets/sidequest-icon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:wght@500;600&family=Public+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <symbol id="sqLogo" viewBox="0 0 512 512">
    <rect width="512" height="512" rx="112" fill="var(--est)"/>
    <path d="M190 84 V 160" fill="none" stroke="var(--planned)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M154 190 H 138 Q 100 190 100 228 V 322" fill="none" stroke="var(--planned)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M226 190 H 262 Q 298 190 298 226 V 254" fill="none" stroke="var(--planned)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M266 296 H 250 Q 224 296 224 322 V 384" fill="none" stroke="var(--planned)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M330 296 H 350 Q 384 296 384 330 V 344" fill="none" stroke="var(--planned)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="190" cy="190" r="36" fill="var(--surface)" stroke="var(--planned)" stroke-width="16"/>
    <circle cx="298" cy="296" r="32" fill="var(--surface)" stroke="var(--planned)" stroke-width="16"/>
    <rect x="74" y="324" width="52" height="52" rx="8" fill="var(--planned)"/>
    <rect x="198" y="382" width="52" height="52" rx="8" fill="var(--planned)"/>
    <rect x="344" y="344" width="80" height="80" rx="9" transform="rotate(45 384 384)" fill="var(--burn)"/>
  </symbol>
</svg>
<div class="app">
  <aside class="side">
    <div class="brandrow"><svg class="logo" aria-hidden="true" focusable="false"><use href="#sqLogo"></use></svg><span class="brand" id="brand">Sidequest</span></div>
    <div class="searchwrap"><label for="searchBox" class="sr-only">Search</label><input type="search" id="searchBox" placeholder="Search  ( / )" autocomplete="off"></div>
    <nav class="nav" aria-label="Views" id="nav"></nav>
    <nav class="nav navbottom" id="navBottom" aria-label="Archive and settings"></nav>
  </aside>
  <div class="column">
    <header class="topbar">
      <div class="tbleft">
        <svg class="logo mlogo" id="mlogo" aria-hidden="true" focusable="false"><use href="#sqLogo"></use></svg>
        <h1 id="viewTitle">Today</h1>
      </div>
      <div class="topact">
        <button id="searchBtn" type="button" class="iconbtn only-mobile" aria-label="Search" title="Search"></button>
        <div class="menuwrap">
          <button class="iconbtn primary" id="newBtn" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="newMenu" aria-label="New" title="New"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true" focusable="false"><path d="M12 5v14M5 12h14"></path></svg></button>
          <div class="menu" id="newMenu" role="menu" hidden>
            <button type="button" role="menuitem" data-act="newProject">New project</button>
            <button type="button" role="menuitem" data-act="newTask">New task</button>
            <button type="button" role="menuitem" data-act="newStep">New step</button>
            <button type="button" role="menuitem" data-act="newDecision">New decision</button>
            <button type="button" role="menuitem" data-act="newMilestone">New milestone</button>
            <button type="button" role="menuitem" data-act="newBacklog">New backlog item</button>
            <button type="button" role="menuitem" data-act="newIdea">New idea for the parking lot</button>
          </div>
        </div>
        <div class="menuwrap">
          <button class="iconbtn" id="moreBtn" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="moreMenu" aria-label="More options" title="More"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true" focusable="false"><path d="M4 7h16M4 12h16M4 17h16"></path></svg></button>
          <div class="menu" id="moreMenu" role="menu" hidden></div>
        </div>
      </div>
    </header>
    <main class="content" id="view"></main>
  </div>
</div>

<div class="overlay" id="overlay" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="mhead"><h2 id="modalTitle"></h2><button type="button" class="small" id="modalClose">Close</button></div>
    <div id="modalBody"></div>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script type="module" src="app/app.js"></script>
</body>
</html>
