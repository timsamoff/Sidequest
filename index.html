<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sidequest</title>
<meta property="og:title" content="Sidequest">
<meta property="og:description" content="A small project planner that runs entirely in your browser. There is no account, no server, and no build step.">
<meta property="og:image" content="https://samoff.com/sidequest/assets/sidequest-icon-512.png">
<meta property="og:url" content="https://samoff.com/sidequest/">
<meta property="og:type" content="website">
<link rel="icon" type="image/svg+xml" href="assets/sidequest-icon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:wght@500;600&family=Public+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <symbol id="sqLogo" viewBox="0 0 512 512">
    <defs>
      <clipPath id="sqLogoClip">
        <rect width="512" height="512" rx="112"/>
      </clipPath>
    </defs>
    <rect width="512" height="512" rx="112" fill="var(--est)"/>
    <g clip-path="url(#sqLogoClip)">
      <path d="M115.88-30.43l30.33,154.2" fill="none" stroke="var(--planned)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M102.47,177.65l-23.25,4.57c-36.81,7.24-51.6,29.27-44.36,66.08l28.7,145.94" fill="none" stroke="var(--planned)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M207.09,157.08l52.31-10.29c34.87-6.86,55.74,7.15,62.6,42.02l9.64,49.01" fill="none" stroke="var(--planned)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M295.51,299.68l-23.25,4.57c-25.19,4.95-35.3,20.02-30.35,45.21l19.38,98.53" fill="none" stroke="var(--planned)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M388.51,281.39l29.06-5.72c32.94-6.48,52.64,6.75,59.12,39.69l4,20.34" fill="none" stroke="var(--planned)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="154.78" cy="167.37" r="53.31" fill="var(--surface)" stroke="var(--planned)" stroke-width="16"/>
      <circle cx="342.01" cy="290.53" r="47.39" fill="var(--surface)" stroke="var(--planned)" stroke-width="16"/>
      <rect x="31.22" y="387.08" width="77.01" height="77.01" rx="8" ry="8" transform="translate(-80.82 21.45) rotate(-11.13)" fill="var(--planned)"/>
      <rect x="227.98" y="435.92" width="77.01" height="77.01" rx="8" ry="8" transform="translate(-86.54 60.34) rotate(-11.13)" fill="var(--planned)"/>
      <rect x="432.89" y="334.59" width="118.48" height="118.48" rx="9" ry="9" transform="translate(-109.15 582.92) rotate(-56.13)" fill="var(--burn)"/>
    </g>
  </symbol>
</svg>
<div class="app">
  <aside class="side">
    <div class="brandrow"><svg class="logo" aria-hidden="true" focusable="false"><use href="#sqLogo"></use></svg><span class="brand" id="brand">Sidequest</span></div>
    <div class="searchwrap"><label for="searchBox" class="sr-only">Search</label><input type="search" id="searchBox" placeholder="Search  ( / )" autocomplete="off"></div>
    <nav class="nav" aria-label="Views" id="nav"></nav>
    <nav class="nav navbottom" id="navBottom" aria-label="Archive and settings"></nav>
  </aside>
  <div class="column">
    <header class="topbar">
      <div class="tbleft">
        <svg class="logo mlogo" id="mlogo" aria-hidden="true" focusable="false"><use href="#sqLogo"></use></svg>
        <h1 id="viewTitle">Today</h1>
      </div>
      <div class="topact">
        <button id="searchBtn" type="button" class="iconbtn only-mobile" aria-label="Search" title="Search"></button>
        <div class="menuwrap">
          <button class="iconbtn primary" id="newBtn" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="newMenu" aria-label="Add item" title="Add item"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true" focusable="false"><path d="M12 5v14M5 12h14"></path></svg></button>
          <div class="menu" id="newMenu" role="menu" hidden>
            <button type="button" role="menuitem" data-act="newProject" title="Add a new project">New project</button>
            <button type="button" role="menuitem" data-act="newTask" title="Add a new task">New task</button>
            <button type="button" role="menuitem" data-act="newStep" title="Add a new step">New step</button>
            <button type="button" role="menuitem" data-act="newDecision" title="Add a new decision">New decision</button>
            <button type="button" role="menuitem" data-act="newMilestone" title="Add a new milestone">New milestone</button>
            <button type="button" role="menuitem" data-act="newBacklog" title="Add a new backlog item">New backlog item</button>
            <button type="button" role="menuitem" data-act="newIdea" title="Add a new idea to the Parking lot">New idea for the parking lot</button>
          </div>
        </div>
        <div class="menuwrap">
          <button class="iconbtn" id="moreBtn" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="moreMenu" aria-label="Main menu" title="Main menu"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true" focusable="false"><path d="M4 7h16M4 12h16M4 17h16"></path></svg></button>
          <div class="menu" id="moreMenu" role="menu" hidden></div>
        </div>
      </div>
    </header>
    <main class="content" id="view"></main>
  </div>
</div>

<div class="overlay" id="overlay" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="mhead"><h2 id="modalTitle"></h2><button type="button" class="small" id="modalClose">Close</button></div>
    <div id="modalBody"></div>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<div class="splash backdropBlurred" id="splash" aria-hidden="true">
  <div class="splashbackdrop"></div>
  <div class="splashpanel">
    <svg class="splashsvg" id="splashSvg" viewBox="0 0 512 512" preserveAspectRatio="xMidYMid meet" aria-hidden="true" focusable="false">
      <rect width="512" height="512" fill="var(--est)"/>
      <g class="splashart" id="splashArt">
        <g id="splashLines" fill="none" stroke="var(--planned)" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"></g>
        <g id="splashNodes"></g>
      </g>
    </svg>
    <p class="splashtext" id="splashText"></p>
  </div>
</div>
<script>
  // Synchronous, inline, blocking: runs the instant the parser reaches this
  // point, before app.js (a deferred module) or any layout/paint of what
  // follows -- the one way to hide the splash before first paint if the
  // user turned it off, since app/splash.js's own JS runs too late for that
  // (confirmed 2026-09-25: the splash otherwise ships visible in plain HTML
  // specifically so its backdrop blur is in effect before ANY JS runs at
  // all, which is correct when the setting is on but would flash the splash
  // once before hiding it if a user has it disabled).
  try {
    var raw = window.localStorage.getItem("sidequest-template-v1");
    var saved = raw ? JSON.parse(raw) : null;
    if (saved && saved.settings && saved.settings.showSplash === false) {
      document.getElementById("splash").hidden = true;
    }
  } catch (e) { /* storage unavailable/unreadable: default to showing the splash */ }
</script>

<script type="module" src="app/app.js"></script>
</body>
</html>
