<div class="app">

        <button id="refreshBtn" type="button" class="iconbtn" hidden aria-label="Refresh to pull data from the web" title="Refresh to pull data from the web"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M21 12a9 9 0 1 1-3-6.7"></path><path d="M21 3v6h-6"></path></svg></button>

<script>
  // Runs before first paint -- the only way to hide the splash if it's turned off.
  try {
    var raw = window.localStorage.getItem("sidequest-template-v1");
    var saved = raw ? JSON.parse(raw) : null;
    if (saved && saved.settings && saved.settings.showSplash === false) {
      document.getElementById("splash").hidden = true;
    }
  } catch (e) { /* storage unavailable/unreadable: default to showing the splash */ }
</script>
