<style>
:root {
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  --font-serif: "Spectral", Georgia, "Times New Roman", serif;
  --font-sans: "Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --bg: #F2F4F1;
  --surface: #FFFFFF;
  --ink: #1A2733;
  --muted: #566772;
  --line: #D3DAD5;
  --planned: #2F5D8A;
  --on-planned: #FFFFFF;
  --actual: #C8631A;
  --burn: #C62F2F;
  --focus: #2F5D8A;
  --late: #A8261C;
  --late-bg: #F8DDD9;
  --chip-idle: #E7ECE8;
  --chip-work: #F6E3C4;
  --chip-done: #CFE6D5;
  --chip-ink: #1A2733;
  --est: #B9CCE0;
  --sel: #E6EEF6;
  --scrim: rgba(15, 25, 35, .5);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #131A20; --surface: #1B252D; --ink: #E6ECEF; --muted: #9AABB5; --line: #2C3843;
    --planned: #86B4E0; --on-planned: #0F1A24; --actual: #F0A25A; --burn: #E5534B; --focus: #86B4E0; --late: #F2A29B; --late-bg: #4A2723;
    --chip-idle: #26323B; --chip-work: #4A3B22; --chip-done: #21402C; --chip-ink: #E6ECEF; --est: #34506B; --sel: #22323F; --scrim: rgba(0, 0, 0, .6);
  }
}
:root[data-theme="dark"] {
  --bg: #131A20; --surface: #1B252D; --ink: #E6ECEF; --muted: #9AABB5; --line: #2C3843;
  --planned: #86B4E0; --on-planned: #0F1A24; --actual: #F0A25A; --burn: #E5534B; --focus: #86B4E0; --late: #F2A29B; --late-bg: #4A2723;
  --chip-idle: #26323B; --chip-work: #4A3B22; --chip-done: #21402C; --chip-ink: #E6ECEF; --est: #34506B; --sel: #22323F; --scrim: rgba(0, 0, 0, .6);
}

html { scroll-padding-top: calc(env(safe-area-inset-top, 0px) + 72px); }
*, *::before, *::after { box-sizing: inherit; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-sans); font-size: 16px; line-height: 1.5; }
h1, h2, h3 { font-family: var(--font-serif); font-weight: 600; line-height: 1.2; margin: 0; }
h1 { font-size: 1.5rem; }
h2 { font-size: 1.3rem; margin-bottom: 6px; }
h3 { font-size: 1.05rem; margin-top: 22px; }
p { margin: 0; }
[hidden] { display: none !important; }
.hint { color: var(--muted); font-size: .9rem; margin-top: 6px; }
.note { margin-top: 12px; color: var(--muted); font-size: .9rem; }
.msg { margin-top: 10px; color: var(--muted); font-size: .9rem; min-height: 1.4em; }

input, select, button, textarea { font: inherit; color: var(--ink); }
input[type="text"], input[type="date"], input[type="number"], textarea {
  background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 7px 10px; min-height: 40px; max-width: 100%; width: 100%;
}
input[type="file"] { max-width: 100%; }
textarea { min-height: 84px; resize: vertical; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
button { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 14px; min-height: 40px; cursor: pointer; }
button:hover { border-color: var(--muted); }
button.primary { background: var(--planned); border-color: var(--planned); color: var(--on-planned); font-weight: 600; }
button.small { min-height: 34px; padding: 4px 10px; font-size: .9rem; }
button.danger:hover, button[data-armed="1"] { border-color: var(--late); color: var(--late); }
.actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; align-items: center; }
.field { display: flex; flex-direction: column; gap: 4px; margin-top: 10px; }
.field label { font-size: .9rem; color: var(--muted); }
.linkbtn { display: inline-flex; align-items: center; min-height: 40px; padding: 8px 14px; border-radius: 8px; background: var(--planned); color: var(--on-planned); font-weight: 600; text-decoration: none; }
.linkbtn:hover { filter: brightness(1.1); }
.textbtn { background: none; border: 0; padding: 4px 0; min-height: 0; color: var(--planned); text-decoration: underline; text-align: left; }

/* shell */
.app { min-height: 100vh; display: grid; grid-template-columns: 220px minmax(0, 1fr); }
.side { position: sticky; top: env(safe-area-inset-top, 0px); align-self: start; height: 100vh; height: 100dvh; padding: 22px 14px; border-right: 1px solid var(--line); display: flex; flex-direction: column; gap: 4px; background: var(--surface); }
.brandrow { display: flex; align-items: center; gap: 10px; padding: 0 6px 16px; }
.logo { width: 38px; height: 38px; flex: none; display: block; }
.mlogo { display: none; width: 44px; height: 44px; }
.brand { font-family: var(--font-serif); font-weight: 600; font-size: 1.25rem; line-height: 1.1; }
.nav { display: flex; flex-direction: column; gap: 2px; overflow-y: auto; }
.navlabel { padding: 14px 12px 4px; font-size: .8rem; color: var(--muted); }
.tab > span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.content.wide { max-width: none; }
.pinbar { display: flex; justify-content: flex-end; margin-bottom: 10px; }
.helpitem { border: 1px solid var(--line); border-radius: 10px; background: var(--surface); margin-top: 10px; }
.helpitem > summary { padding: 12px 14px; font-weight: 600; cursor: pointer; color: var(--ink); font-size: 1rem; }
.hbody { padding: 0 14px 12px; }
.hbody ul { margin: 0; padding-left: 1.2rem; }
.hbody li { margin-top: 6px; }
kbd { font: inherit; font-size: .9em; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 5px; padding: 0 6px; background: var(--bg); }
.standing { list-style: none; margin: 0; padding: 0; }
.standing li { padding: 12px 0; border-bottom: 1px solid var(--line); }
.standing li:first-child { padding-top: 0; }
.standing li:last-child { border-bottom: 0; padding-bottom: 0; }
.srow { display: flex; justify-content: space-between; align-items: baseline; gap: 4px 12px; flex-wrap: wrap; }
.srow .plink, .srow .slabel { font-weight: 600; font-size: 1rem; }
.plink { text-decoration: none; }
.plink:hover, .plink:focus-visible { text-decoration: underline; }
.scount { color: var(--muted); font-size: .9rem; }
.snext { margin-top: 2px; color: var(--muted); font-size: .92rem; }
.tbleft { display: flex; align-items: center; gap: 10px; min-width: 0; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.searchwrap { padding: 0 4px 12px; }
.searchwrap input { width: 100%; }
.searchbar { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; }
.searchbar input[type="search"] { flex: 1 1 260px; width: auto; }
.searchbar label { display: flex; gap: 8px; align-items: center; color: var(--muted); cursor: pointer; }
input[type="search"] { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 7px 10px; min-height: 40px; max-width: 100%; }
mark { background: var(--chip-work); color: inherit; border-radius: 3px; padding: 0 1px; }
.sgroup { margin-top: 22px; }
.sgroup h3 { margin-top: 0; }
.sgroup .item .snip { margin-top: 4px; color: var(--muted); font-size: .9rem; }
.chip.arch { background: var(--late-bg); color: var(--late); }
.tab { display: flex; align-items: center; justify-content: space-between; gap: 8px; width: 100%; text-align: left; border: 0; background: transparent; border-radius: 8px; padding: 10px 12px; min-height: 44px; color: var(--muted); font-weight: 500; }
.tab:hover { background: var(--chip-idle); border: 0; }
.tab[aria-current="page"] { background: var(--sel); color: var(--ink); font-weight: 600; box-shadow: inset 3px 0 0 var(--planned); }
.navbottom { margin-top: auto; padding-top: 8px; border-top: 1px solid var(--line); }
.column { min-width: 0; }
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 24px; background: var(--bg); border-bottom: 1px solid var(--line); }
.topact { display: flex; gap: 8px; align-items: center; flex: none; }
.topact button { white-space: nowrap; }
#viewTitle { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.menuwrap { position: relative; }
.menu { position: absolute; right: 0; top: calc(100% + 6px); min-width: 210px; padding: 6px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 8px 24px rgba(0, 0, 0, .18); z-index: 30; display: flex; flex-direction: column; }
.menu button { border: 0; background: transparent; text-align: left; border-radius: 6px; padding: 9px 12px; min-height: 42px; }
.menu button:hover { background: var(--chip-idle); }
.menu button[aria-current="page"] { background: var(--sel); font-weight: 600; }
.menu { max-height: 75vh; overflow-y: auto; }
.menulabel { padding: 10px 12px 2px; font-size: .8rem; color: var(--muted); }
.menu hr { border: 0; border-top: 1px solid var(--line); margin: 4px 0; width: 100%; }
.content { padding: 22px 24px 72px; max-width: 1040px; }

.twocol { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 22px; align-items: start; }
.cols2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 22px; align-items: start; }
.pgrid { display: block; }
.pgrid > .cl, .pgrid > .cr { min-width: 0; margin-top: 12px; }
.pgrid > .cl.r1 { margin-top: 0; }
.pgrid > .cr.r1 { margin-top: 26px; }
.pgrid > button { justify-self: start; }
.listbox { border: 1px solid var(--line); border-radius: 10px; background: var(--surface); overflow: hidden; }
.listbox > .list { border: 0; border-radius: 0; margin: 0; background: transparent; }
.listbox > .progress { margin: 0; padding: 10px 14px; border-bottom: 1px solid var(--line); }
.listbox > .progress:empty { display: none; }
@media (min-width: 900px) {
  .pgrid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); column-gap: 22px; row-gap: 12px; }
  .pgrid > .cl, .pgrid > .cr, .pgrid > .cr.r1 { margin-top: 0; }
  .pgrid > .cl { grid-column: 1; }
  .pgrid > .cr { grid-column: 2; }
  .pgrid > .r1 { grid-row: 1; }
  .pgrid > .r2 { grid-row: 2; }
  .pgrid > .r3 { grid-row: 3; }
  .pgrid > .r4 { grid-row: 4; }
}

.panel { padding: 16px 18px; background: var(--surface); border: 1px solid var(--line); border-left: 5px solid var(--planned); border-radius: 10px; }
.box { padding: 14px 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
.ptitle { font-family: var(--font-serif); font-size: 1.3rem; font-weight: 600; line-height: 1.3; }
.pmeta { margin-top: 6px; color: var(--muted); }
.pmeta b { color: var(--ink); font-weight: 600; }
.pline { margin-top: 8px; }
.badge { display: inline-block; padding: 1px 9px; border-radius: 999px; font-size: .8rem; font-weight: 600; background: var(--late-bg); color: var(--late); vertical-align: 1px; }
.tabbadge { min-width: 22px; text-align: center; padding: 0 6px; }
.chip { display: inline-block; padding: 1px 10px; border-radius: 999px; font-size: .82rem; background: var(--chip-idle); color: var(--chip-ink); }
.chip[data-v="In progress"] { background: var(--chip-work); }
.chip[data-v="Completed"] { background: var(--chip-done); }
.tlist { list-style: none; margin: 10px 0 0; padding: 0; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); overflow: hidden; }
.tlist li { border-bottom: 1px solid var(--line); }
.tlist li:last-child { border-bottom: 0; }
.tlist li.plain { padding: 12px 14px; color: var(--muted); font-size: .92rem; }
.item { display: block; width: 100%; text-align: left; border: 0; border-radius: 0; background: transparent; padding: 12px 14px; min-height: 0; }
.item:hover { background: var(--chip-idle); border: 0; }
.item[aria-current="true"] { background: var(--sel); box-shadow: inset 4px 0 0 var(--planned); }
.item .l1 { color: var(--muted); font-size: .85rem; }
.item .l1 b { color: var(--ink); font-weight: 600; }
.item .l2 { margin-top: 2px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.item.done .l2 { color: var(--muted); }
.item .l3 { margin-top: 6px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: .85rem; color: var(--muted); }

.split { display: grid; grid-template-columns: minmax(280px, .95fr) minmax(0, 1.25fr); gap: 22px; align-items: start; margin-top: 12px; }
.split .tlist { margin-top: 0; }
.detailpane { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 84px); }
.detail { padding: 18px 20px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
.detail .what { font-family: var(--font-serif); font-size: 1.25rem; font-weight: 600; line-height: 1.3; margin-top: 8px; }
.detail .dmeta { color: var(--muted); margin-top: 4px; }
select.status { border: 1px solid var(--line); border-radius: 999px; padding: 5px 12px; min-height: 38px; background: var(--chip-idle); color: var(--chip-ink); }
select.status[data-v="In progress"] { background: var(--chip-work); }
select.status[data-v="Completed"] { background: var(--chip-done); }
.steps { list-style: none; margin: 8px 0 0; padding: 0; }
.steps li { display: flex; gap: 10px; align-items: flex-start; padding: 5px 0; }
.steps li label { display: flex; gap: 10px; align-items: flex-start; flex: 1 1 auto; cursor: pointer; }
.steps li.done span { color: var(--muted); text-decoration: line-through; }
input[type="checkbox"], input[type="radio"] { width: 20px; height: 20px; margin: 2px 0 0; flex: none; accent-color: var(--planned); }
.inline { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.inline input[type="text"] { flex: 1 1 180px; width: auto; }
.only-mobile { display: none; }
.iconbtn { width: 44px; height: 44px; min-height: 44px; padding: 0; display: inline-flex; align-items: center; justify-content: center; border-radius: 10px; flex: none; }
.iconbtn svg { width: 20px; height: 20px; display: block; }
.iconbtn.only-mobile { display: none; }
.toast .toastbtn { margin-left: 12px; background: transparent; border: 1px solid currentColor; color: inherit; min-height: 32px; padding: 2px 12px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.chipbtn { border-radius: 999px; min-height: 36px; padding: 4px 14px; }
.chipbtn[aria-pressed="true"] { background: var(--sel); border-color: var(--planned); color: var(--planned); font-weight: 600; }
button.dangerfill { background: var(--late); border-color: var(--late); color: var(--bg); font-weight: 600; }
button:disabled { opacity: .5; cursor: not-allowed; }
.dangerbox { border: 1px solid var(--late); background: var(--late-bg); border-radius: 10px; padding: 14px 16px; margin-top: 10px; }
.setgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 4px 16px; max-width: 640px; }
.setgrid .field { min-width: 0; justify-content: flex-end; }
.setgrid input, .setgrid select { min-width: 0; height: 42px; }
@media (max-width: 640px) { .setgrid { grid-template-columns: minmax(0, 1fr); } }
.about p { margin-top: 2px; }
.radiorow { display: flex; gap: 10px; align-items: flex-start; margin-top: 10px; cursor: pointer; }
select.plain { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 7px 10px; min-height: 40px; max-width: 100%; width: 100%; }
button.small.on { background: var(--sel); border-color: var(--planned); color: var(--planned); font-weight: 600; }
.steps li { flex-wrap: wrap; }

.list { list-style: none; margin: 12px 0 0; padding: 0; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
.list > li { padding: 12px 14px; border-bottom: 1px solid var(--line); }
.list > li:last-child { border-bottom: 0; }
.list.check label { display: flex; gap: 12px; align-items: flex-start; cursor: pointer; }
.list.check li.done span { color: var(--muted); text-decoration: line-through; }
.progress { color: var(--muted); margin-top: 10px; }
.crow { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: flex-start; }
.crow label { display: flex; gap: 10px; align-items: flex-start; font-weight: 600; cursor: pointer; flex: 1 1 200px; }
.cnote { color: var(--muted); font-size: .92rem; margin: 2px 0 0 30px; }
.cfields { display: flex; flex-wrap: wrap; gap: 12px; margin: 6px 0 0 30px; }
.cfields .field { margin-top: 4px; }
.cfields input { width: 10rem; }
.li-actions { display: flex; gap: 8px; }
.dq { font-weight: 500; }
.dstate { font-size: .85rem; color: var(--muted); margin-left: 8px; }
.dstate.ok { color: var(--planned); }
.decision input[type="text"] { margin-top: 6px; }
.sechead { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 22px; }
.sechead h3 { margin-top: 0; }
.first { margin-top: 0; }

.chartbox { margin-top: 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); padding: 12px 12px 4px; }
svg.chart { display: block; width: 100%; height: auto; }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .axis { fill: var(--muted); font-size: 12px; font-family: var(--font-sans); }
.chart .planned { fill: none; stroke: var(--planned); stroke-width: 2.5; stroke-dasharray: 7 5; }
.chart .actual { fill: none; stroke: var(--burn); stroke-width: 3; }
.chart .dot { fill: var(--burn); stroke: var(--surface); stroke-width: 2; }

}
function wireMenu(btnId, menuId) {
  var b = $(btnId), m = $(menuId);
  on(b, "click", function (e) {
    e.stopPropagation();
    var wasOpen = !m.hidden; closeMenus(false);
    if (!wasOpen) { m.hidden = false; b.setAttribute("aria-expanded", "true"); var f = m.querySelector("button"); if (f) f.focus(); }
  });
  on(m, "click", function (e) {
    var t = e.target.closest ? e.target.closest("button[data-act], button[data-view]") : null; if (!t) return;
    closeMenus(false);
    if (t.getAttribute("data-view")) { go(t.getAttribute("data-view")); return; }
    var act = t.getAttribute("data-act");
    ({ newTask: taskDialog, newBacklog: function () { taskDialog(undefined, true); }, newStep: function () { stepDialog(false); }, newProject: projectDialog, newIdea: ideaDialog, newDecision: decisionDialog, newMilestone: milestoneDialog, slip: slipDialog, archive: function () { go("archive"); }, settings: function () { go("settings"); } })[act]();
  });

    if (e.key !== "ArrowDown" && e.key !== "ArrowUp") return;
    var items = Array.prototype.slice.call(m.querySelectorAll("button")); var i = items.indexOf(document.activeElement);
    e.preventDefault(); items[(i + (e.key === "ArrowDown" ? 1 : -1) + items.length) % items.length].focus();
  });
}

// Boot sequence. Deferred one microtask past module evaluation: app.js sits in a
// genuine import cycle with state.js/views.js/dialogs.js/search.js (confirmed
// acceptable, see DESIGN.md), and a module graph this cyclic can evaluate this
// entry module's own top-level code before every module it transitively imports
// has finished its own top-level evaluation, depending on which module the loader
// happens to enter the graph from. Deferring the boot sequence past microtask
// queue drain guarantees the whole graph (including state.js's `state = load()`)
// has finished evaluating first, regardless of traversal order.
Promise.resolve().then(function () {
  $("brand").textContent = APP_NAME;
  applyTheme();
  autoArchive(); save();
  renderAll();

  // If this view is running as a published Claude artifact with the db
  // capability granted, its saved state lives there, not in this browser's
  // localStorage -- check for it after the page has already painted once
  // (never blocks first render on an async capability lookup). On the web
  // app, getDb() resolves null immediately and this is a no-op. See
  // DESIGN.md's "Claude Artifact parity version" section.
  loadFromDbIfAvailable().then(function (swapped) {
    if (!swapped) return;
    autoArchive(); save();
    renderAll();
  });

  wireMenu("newBtn", "newMenu"); wireMenu("moreBtn", "moreMenu");
  wireSearchInput($("searchBox"), "side");
  on($("searchBtn"), "click", function () { if (ui.view === "search") closeSearch(); else openSearch(true); });
  document.addEventListener("keydown", function (e) {
    if (e.key !== "/" || e.ctrlKey || e.metaKey || e.altKey) return;
    var t = e.target, tag = t && t.tagName;
    if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT" || (t && t.isContentEditable)) return;
    if (!$("overlay").hidden) return;
    e.preventDefault(); focusSearch();
  });
  document.addEventListener("click", function (e) {
    if (!e.target.closest || !e.target.closest(".menuwrap")) closeMenus(false);
  });
});

})();
</script>
